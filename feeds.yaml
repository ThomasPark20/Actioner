  - name: SecurityWeek
    type: url
    url: https://www.securityweek.com/feed/
  - name: The Register (Security)
    type: url
    url: https://www.theregister.com/security/headlines.atom
  - name: Darknet
    type: url
    url: https://darknet.org.uk/feed/
  - name: Threatpost
    type: url
    url: https://threatpost.com/feed/
