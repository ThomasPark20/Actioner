# Actioner feed sources.
#
# Two sections, both fetched every run (the ingest skill reads both):
#   feeds:        — the shipped defaults. Edit if you like, but toolkit updates may change them.
#   custom_feeds: — YOUR feeds. Add yours here; this section is yours to own.
#
# Each entry: name, type (url | repo; default url), and a url OR repo+path.
#   type: url   — public RSS/Atom feed, fetched via web_fetch
#   type: repo  — private/internal intel pulled from a connected GitHub repo
#
# Note: feeds need the routine environment's network Access level = `Full` (or
# `Custom` + feed domains); under the default `Trusted` level the egress proxy
# 403s every feed domain (see /actioner:setup).

feeds:
  - name: Unit42
    type: url
    url: https://unit42.paloaltonetworks.com/feed/
  - name: The DFIR Report
    type: url
    url: https://thedfirreport.com/feed/
  - name: SentinelOne Labs
    type: url
    url: https://www.sentinelone.com/labs/feed/
  - name: Cisco Talos
    type: url
    url: https://blog.talosintelligence.com/rss/
  - name: Microsoft Security Blog
    type: url
    url: https://www.microsoft.com/en-us/security/blog/feed/
  - name: BleepingComputer
    type: url
    url: https://www.bleepingcomputer.com/feed/
  - name: The Record
    type: url
    url: https://therecord.media/feed
  - name: Krebs on Security
    type: url
    url: https://krebsonsecurity.com/feed/
  - name: The Hacker News
    type: url
    url: https://feeds.feedburner.com/TheHackersNews
  - name: CyberScoop
    type: url
    url: https://cyberscoop.com/feed
  - name: Cyber Security News
    type: url
    url: https://cybersecuritynews.com/feed/
  - name: GBHackers
    type: url
    url: https://gbhackers.com/feed/
  - name: Hackread
    type: url
    url: https://hackread.com/feed/
  - name: Security Affairs
    type: url
    url: https://securityaffairs.com/feed
  - name: Security Online
    type: url
    url: https://securityonline.info/feed/
  - name: Infosecurity Magazine
    type: url
    url: https://www.infosecurity-magazine.com/rss/news/
  - name: SC Media
    type: url
